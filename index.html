<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Workshop Hub | Your training plan</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="activities.js"></script>
<style>
:root{
  --side:#0F1E29;--side2:#16303D;--side-ink:#DCE7EA;--side-mute:#8FA7AE;
  --bg:#F2F5F4;--card:#FFFFFF;--ink:#12212A;--mute:#5B6C73;--line:#E1E7E6;--soft:#EEF3F2;
  --teal:#0E7C86;--teal2:#12A0A8;--tealsoft:#DDF0F1;--amber:#E39B2D;--ambersoft:#FCEFD9;--red:#C0563F;--redsoft:#F6E1DB;
  --shadow:0 1px 2px rgba(15,30,41,.06),0 8px 24px rgba(15,30,41,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B151C;--card:#132430;--ink:#E4EDEF;--mute:#94A9B0;--line:#223844;--soft:#182C38;--tealsoft:#123A40;--ambersoft:#3A2C14;--redsoft:#3A1F19;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0B151C;--card:#132430;--ink:#E4EDEF;--mute:#94A9B0;--line:#223844;--soft:#182C38;--tealsoft:#123A40;--ambersoft:#3A2C14;--redsoft:#3A1F19}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,h4,.num{font-family:"Bricolage Grotesque",Manrope,system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
a{color:var(--teal)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside.side{background:linear-gradient(180deg,var(--side),#0B1720);color:var(--side-ink);padding:26px 18px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center}.brand b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:17px}.brand small{color:var(--side-mute);font-size:12.5px}
nav.nav{display:flex;flex-direction:column;gap:2px}
nav.nav button{display:flex;gap:12px;align-items:center;border:0;background:none;color:var(--side-ink);padding:10px 12px;border-radius:9px;font-weight:600;text-align:left;opacity:.78}
nav.nav button svg{width:18px;height:18px;flex:none}
nav.nav button[aria-current="page"]{background:var(--side2);opacity:1;box-shadow:inset 3px 0 0 var(--amber)}
.live{margin-top:auto;font-size:12.5px;color:var(--side-mute);border-top:1px solid var(--side2);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6FD3A0;margin-right:6px;box-shadow:0 0 0 3px rgba(111,211,160,.2)}
main{padding:30px 36px 60px;min-width:0;max-width:1180px}
.top h1{font-size:32px;font-weight:800;letter-spacing:-.02em}.top p{margin:6px 0 22px;color:var(--mute);max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:16px;margin-bottom:4px}.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--teal);color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14.5px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--ambersoft);border:1px solid #F0D3A2;padding:12px 16px;border-radius:12px;margin-bottom:18px;font-size:14px}
.notice button{border:0;background:none;color:var(--teal);font-weight:700;padding:0;text-decoration:underline}
.finder{background:radial-gradient(120% 140% at 100% 0%,#1B4A54,var(--side) 65%);color:#EAF2F3;border:0}
.finder h2{font-size:24px;color:#fff;margin-bottom:6px}.finder p{color:#A9C1C6;margin:0 0 16px}
.finder form{display:flex;gap:10px;flex-wrap:wrap}
.finder input{flex:1 1 220px;padding:13px 16px;border-radius:10px;border:0;font-size:16px;background:#fff;color:#12212A}
.hint{font-size:13px;color:#A9C1C6;margin-top:10px}.hint button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:999px;padding:3px 10px;margin:4px 4px 0 0;font-size:12.5px}
.msg{margin-top:16px}
.kpi .num{font-size:34px;font-weight:800}.kpi p{margin:4px 0 0;color:var(--mute);font-size:13px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;margin:11px 0}
.hbar .t{font-size:14px;font-weight:600}.hbar .p{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.hbar .tr{grid-column:1/-1;height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--teal2))}
.hbar.top .tr i{background:linear-gradient(90deg,#D48A1C,var(--amber))}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap}
.Starter{background:var(--ambersoft);color:#9A5B0B}.Practitioner{background:var(--tealsoft);color:var(--teal)}.Builder{background:var(--teal);color:#fff}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.grp{background:var(--soft);border-radius:12px;padding:16px;font-size:14px}
.grp-h{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.grp-h b{font-family:"Bricolage Grotesque",sans-serif;font-size:16px}
.codes{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.codes span{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:2px 8px;font:12.5px ui-monospace,Menlo,monospace}
.lbl{font-size:12px;font-weight:700;color:var(--mute);margin:8px 0 4px}
.grp ol{margin:0;padding-left:18px}
/* plan card */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:18px;box-shadow:var(--shadow)}
.pc-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;background:var(--side);color:#EAF2F3;padding:22px 24px}
.pc-head h2{font-size:26px;color:#fff;margin:2px 0;font-family:ui-monospace,Menlo,monospace;font-weight:700}
.pc-kicker{margin:0;color:#E39B2D;font-size:12px;font-weight:700}.pc-sub{margin:0;color:#A9C1C6;font-size:13px}
.pc-body{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.pc-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.box{background:var(--soft);border-radius:12px;padding:14px 16px}.box h4{font-size:15px;margin-bottom:6px}.box p{margin:0 0 6px}.box ul{margin:0;padding-left:18px}
.safe{border-left:4px solid;border-radius:0 12px 12px 0}
.pc-h{font-size:18px;margin-top:4px}
.act{border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.act-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}.n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800}
.act h4{font-size:16px}.meta{color:var(--mute);font-size:12.5px;margin:2px 0 0}
.act p{margin:0 0 8px}
.ai{background:var(--tealsoft);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.ai b{display:block;font-size:12px;color:var(--teal);margin-bottom:2px}
.prompt{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border-radius:8px;padding:10px 12px;margin:4px 0 8px;position:relative}
.copy{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:12px;padding:2px 8px}
.cap{background:var(--ambersoft);border-radius:14px;padding:16px 18px}.cap .goal{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;font-weight:700;margin:0 0 8px}.cap ol{margin:0;padding-left:20px}
/* library */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.lib details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.lib summary{cursor:pointer;font-weight:700;list-style:none}.lib summary::-webkit-details-marker{display:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tags span{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mute)}
/* how */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:8px}
.fn{background:var(--soft);border-radius:12px;padding:16px;position:relative}
.fn .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--teal);color:#fff;margin-bottom:10px}.fn .ic svg{width:19px;height:19px}
.fn.ai-step .ic{background:var(--amber)}
.fn b{display:block;margin-bottom:4px}.fn span{font-size:13px;color:var(--mute)}
.yes li::marker{color:var(--teal)}.no li::marker{color:var(--red)}
.empty{text-align:center;padding:50px 20px;color:var(--mute)}.empty h2{color:var(--ink);font-size:21px;margin-bottom:8px}
.hidden{display:none!important}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside.side{position:static;height:auto;padding:16px;gap:14px}
  nav.nav{flex-direction:row;overflow-x:auto}nav.nav button{white-space:nowrap}
  .live{margin-top:0;border-top:0;padding-top:0}
  main{padding:20px 16px 50px}.g2{grid-template-columns:minmax(0,1fr)}
  .pc-head,.pc-body{padding:16px}
}
@media print{aside.side,.finder,.notice,.copy,nav{display:none!important}.app{display:block}main{padding:0}.pcard{box-shadow:none;border:0}.act,.cap{break-inside:avoid}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
 <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
 <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></symbol>
 <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-5a2 2 0 0 0-2 2"/><path d="M20 4v14h-6"/></symbol>
 <symbol id="i-flow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.5 6H15a3 3 0 0 1 3 3v6.5M5 8.5V15a3 3 0 0 0 3 3h8.5"/></symbol>
 <symbol id="i-form" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
 <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
 <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
 <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
 <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
 <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
</svg>
<div class="app">
 <aside class="side">
  <div class="brand">
   <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#E39B2D"/><circle cx="13" cy="14" r="3.2" fill="#0F1E29"/><circle cx="27" cy="13" r="3.2" fill="#0F1E29"/><circle cx="20" cy="27" r="3.6" fill="#0F1E29"/><path d="M13 14L20 27L27 13M13 14L27 13" stroke="#0F1E29" stroke-width="2"/></svg>
   <div><b>AI Workshop Hub</b><small>Training plans written by AI</small></div>
  </div>
  <nav class="nav" aria-label="Views">
   <button data-view="plan" aria-current="page"><svg><use href="#i-user"/></svg>My training plan</button>
   <button data-view="insights"><svg><use href="#i-chart"/></svg>Group insights</button>
   <button data-view="groups"><svg><use href="#i-users"/></svg>Workshop groups</button>
   <button data-view="library"><svg><use href="#i-book"/></svg>Activity library</button>
   <button data-view="how"><svg><use href="#i-flow"/></svg>How it works</button>
  </nav>
  <div class="live" id="live"><span><span class="dot"></span>Loading plans…</span></div>
 </aside>
 <main>
  <div class="notice hidden" id="sampleNote"><span><b>Sample data.</b> No live plans yet, so you're seeing plans made from fictional answers. Real plans appear here automatically as people respond. <button type="button" id="leaveSample">Show live data</button></span></div>
  <section id="v-plan"></section>
  <section id="v-insights" class="hidden"></section>
  <section id="v-groups" class="hidden"></section>
  <section id="v-library" class="hidden"></section>
  <section id="v-how" class="hidden"></section>
 </main>
</div>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ico=id=>`<svg><use href="#${id}"/></svg>`;
const LIB=window.ACTIVITIES||[];const BYID=Object.fromEntries(LIB.map(a=>[a.id,a]));
const LEVELS=["Starter","Practitioner","Builder"];
const LEVEL_DESC={Starter:"New to AI, or not yet confident with it. Guided practice with a chat assistant, one step at a time, checking every answer.",Practitioner:"Has tried AI tools. Writes stronger prompts, builds reusable templates and works with real documents and spreadsheets.",Builder:"Confident with AI. Connects it to everyday work with templates and automated flows."};
const SAFETY={red:["High care","var(--red)","Your work involves customer, billing, employee or health information. Never paste it into an AI tool. Replace names, account numbers, addresses and amounts with placeholders such as [Customer] before you start. Use only company-approved tools, and a person always reviews the result before anything is sent."],
 amber:["Take care","var(--amber)","Some of your work is internal-only or needs approval. Remove anything confidential before prompting, use company-approved tools only, and follow the usual approval step before sharing AI-assisted work."],
 green:["Standard care","var(--teal)","Your examples are lower risk, but the basics still apply: no names, ID numbers or passwords in prompts, and check every output before you use it."]};
const DEPT={HR:"Human Resources",CX:"Customer Experience",Other:"Other teams"};
const TAGNAME={email:"Writing",summarise:"Summarising",excel:"Data",reports:"Reports",presentations:"Presentations",minutes:"Minutes",customer:"Customer",forms:"Forms and flows",research:"Research",scheduling:"Scheduling"};
let live={plans:[],facts:[],updated:null},sample=null,useSample=false,view="plan",lastCode="";
const data=()=>useSample&&sample?sample:live;

async function fetchJSON(u){const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
async function refresh(first){
  try{live=await fetchJSON("data/plans.json")}catch(e){}
  if(first){try{sample=await fetchJSON("data/sample.json")}catch(e){};useSample=!live.plans.length&&!!sample}
  if(live.plans.length&&useSample)useSample=false;
  renderAll();
}
function ago(iso){if(!iso)return"not yet";const m=Math.round((Date.now()-new Date(iso))/60000);return m<1?"just now":m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} d ago`}
function renderLive(){const d=data();$("#live").innerHTML=`<span><span class="dot"></span>${useSample?"Sample data":"Live"}: ${d.plans.length} plan${d.plans.length===1?"":"s"}</span><span>Last update ${ago(d.updated)}</span><span>New responses are processed automatically.</span>`;
  $("#sampleNote").classList.toggle("hidden",!useSample)}

/* ---------- my plan ---------- */
function findPlans(code){const c=code.trim().toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");if(!c)return[];return data().plans.filter(p=>p.code===c||p.code.startsWith(c+"-")&&/^\d+$/.test(p.code.slice(c.length+1)))}
function renderPlan(){
  const el=$("#v-plan");const d=data();
  const tries=useSample?d.plans.filter(p=>!p.code.startsWith("anon-")).slice(0,4).map(p=>`<button type="button" data-try="${esc(p.code)}">${esc(p.code)}</button>`).join(""):"";
  el.innerHTML=`<div class="top"><h1>Your AI training plan</h1><p>When you completed the needs assessment, AI read your answers and wrote a training plan for you: your level, three practice activities chosen for your kind of work, your data-safety rules and a capstone challenge. Enter the code you created to see it.</p></div>
  <div class="card finder"><h2>Find my plan</h2><p>Use the participant code you made up on the form, for example <b>mango-482</b>.</p>
   <form id="findForm" autocomplete="off"><input id="code" aria-label="Participant code" placeholder="Your participant code" value="${esc(lastCode)}"><button class="btn" type="submit">Show my plan</button></form>
   ${tries?`<div class="hint">Try a sample code: ${tries}</div>`:""}</div>
  <div id="planOut"></div>`;
  $("#findForm").onsubmit=e=>{e.preventDefault();lastCode=$("#code").value;showPlan()};
  el.querySelectorAll("[data-try]").forEach(b=>b.onclick=()=>{lastCode=b.dataset.try;$("#code").value=lastCode;showPlan()});
  if(lastCode)showPlan();
}
function showPlan(){
  const out=$("#planOut");const ps=findPlans(lastCode);
  if(!lastCode.trim()){out.innerHTML="";return}
  if(!ps.length){out.innerHTML=`<div class="card msg"><h3>No plan found for “${esc(lastCode)}” yet</h3><p class="sub" style="margin:6px 0 0">Plans are written automatically and usually appear within about an hour of submitting the form. Check the code is typed exactly as you entered it. This page refreshes on its own.</p></div>`;return}
  out.innerHTML=(ps.length>1?`<div class="notice" style="margin-top:16px">More than one person chose this code. Pick yours by the date you submitted.</div>`:"")+ps.map(cardHtml).join("");
  out.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.parentElement.dataset.p);b.textContent="Copied"}catch(e){b.textContent="Select and copy"}setTimeout(()=>b.textContent="Copy",1600)});
}
function cardHtml(p){
  const S=SAFETY[p.safety]||SAFETY.green;
  return `<article class="pcard"><header class="pc-head"><div><p class="pc-kicker">Personal training plan, written by AI</p><h2>${esc(p.code)}</h2><p class="pc-sub">${esc(DEPT[p.dept]||"")}  |  Created ${esc(p.date)}</p></div><span class="pill ${p.level}">${p.level}</span></header>
  <div class="pc-body">
   <div class="pc-row"><div class="box"><h4>Your level: ${p.level}</h4><p>${LEVEL_DESC[p.level]}</p><p><b>Your focus:</b> ${esc(p.focus)}</p></div>
    <div class="box"><h4>Your starting point</h4><ul>${p.starting_point.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>
   <div class="box safe" style="border-color:${S[1]}"><h4 style="color:${S[1]}">Data safety: ${S[0]}</h4><p>${S[2]}</p></div>
   <h3 class="pc-h">Your three practice activities</h3>
   ${p.activities.map((x,i)=>{const a=BYID[x.id];if(!a)return"";return `<section class="act"><div class="act-h"><span class="n">${i+1}</span><div><h4>${esc(a.title)}</h4><p class="meta">About ${a.minutes} minutes${a.file?`  |  Practice file: <a href="${esc(a.file)}">${esc(a.file.replace("practice/",""))}</a>`:""}</p></div></div>
     <div class="ai"><b>Why this one for you</b>${esc(x.why)}</div>
     <p>${esc(a.scenario)}</p><p class="lbl">Try this prompt</p><div class="prompt" data-p="${esc(a.prompt)}"><button class="copy" type="button">Copy</button>${esc(a.prompt)}</div>
     <div class="ai"><b>Make it yours</b>${esc(x.tailoring)}</div>
     <p style="font-size:14px"><b>What good looks like:</b> ${esc(a.check)}</p></section>`}).join("")}
   <h3 class="pc-h">Your capstone challenge</h3>
   <section class="cap"><p class="goal">${esc(p.capstone.goal)}</p><p style="margin:0 0 6px">Build a first version by the end of the workshop:</p><ol>${p.capstone.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></section>
  </div></article>`;
}

/* ---------- insights ---------- */
const MIN=3;
function tally(list){const m=new Map();list.forEach(x=>m.set(x,(m.get(x)||0)+1));return[...m.entries()].sort((a,b)=>b[1]-a[1])}
function bars(t,total,limit,ordered){const max=Math.max(1,...t.map(x=>x[1]));return t.slice(0,limit||99).map(([k,v],i)=>`<div class="hbar${i===0&&!ordered?" top":""}"><span class="t">${esc(k)}</span><span class="p">${v} (${Math.round(v/total*100)}%)</span><div class="tr"><i style="width:${v/max*100}%"></i></div></div>`).join("")}
function renderInsights(){
  const el=$("#v-insights");const d=data();const n=d.plans.length,f=d.facts;
  const head=`<div class="top"><h1>Group insights</h1><p>What the whole group told us, combined. Nothing here can be traced to one person: only totals are shown, and any group smaller than ${MIN} people is hidden.</p></div>`;
  if(n<MIN){el.innerHTML=head+`<div class="card empty"><h2>Not enough responses yet</h2><p>Insights appear once at least ${MIN} people have responded. So far: ${n}.</p></div>`;return}
  const comf=f.flatMap(x=>x.comfort||[]);const avg=comf.length?comf.reduce((a,b)=>a+b,0)/comf.length:0;
  const heavy=f.filter(x=>/2 to 5|more than 5/i.test(x.hours||"")).length;
  const noTool=f.filter(x=>!x.tools||!x.tools.length).length;
  const want=tally(f.flatMap(x=>x.want||[]).filter(x=>x!=="Other"));
  const lv=LEVELS.map(l=>[l,d.plans.filter(p=>p.level===l).length]).filter(x=>x[1]);
  const dep=tally(d.plans.map(p=>DEPT[p.dept]||"Other teams")).map(([k,v])=>v<MIN?["Other teams (combined)",v]:[k,v]);
  const depM=new Map();dep.forEach(([k,v])=>depM.set(k,(depM.get(k)||0)+v));
  const hoursOrder=["Almost none","Up to 2 hours","2 to 5 hours","More than 5 hours"];
  const hrs=hoursOrder.map(h=>[h,f.filter(x=>x.hours===h).length]);
  const stmts=["I understand what AI tools can do","I feel comfortable trying AI tools at work","I know what information is safe to share with AI"];
  const sAvg=stmts.map((s,i)=>{const v=f.map(x=>(x.comfort||[])[i]).filter(Boolean);return[s,v.length?v.reduce((a,b)=>a+b,0)/v.length:0]});
  el.innerHTML=head+`<div class="grid g4">
   <div class="card kpi"><div class="num">${n}</div><p>people have a plan</p></div>
   <div class="card kpi"><div class="num">${avg.toFixed(1)}<span style="font-size:17px;color:var(--mute)"> / 5</span></div><p>average comfort with AI</p></div>
   <div class="card kpi"><div class="num">${Math.round(heavy/f.length*100)}%</div><p>lose 2+ hours a week re-typing information</p></div>
   <div class="card kpi"><div class="num">${Math.round(noTool/f.length*100)}%</div><p>have not used an AI tool yet</p></div></div>
  <div class="grid g2" style="margin-top:18px">
   <div class="card"><h3>Training levels</h3><p class="sub">Set by the same rules for everyone</p>${bars(lv.map(([k,v])=>[k+"s",v]),n,0,true)}</div>
   <div class="card"><h3>Teams taking part</h3><p class="sub">Teams with fewer than ${MIN} people are combined</p>${bars([...depM.entries()].sort((a,b)=>b[1]-a[1]),n)}</div>
   <div class="card"><h3>Where people want AI help</h3><p class="sub">Share of people choosing each task</p>${bars(want,f.length,8)}</div>
   <div class="card"><h3>Weekly time lost to re-typing</h3><p class="sub">Copying information between systems or documents</p>${bars(hrs,f.length,0,true)}</div>
   <div class="card"><h3>Confidence with AI</h3><p class="sub">Average agreement, from 1 (strongly disagree) to 5 (strongly agree)</p>${sAvg.map(([s,v])=>`<div class="hbar"><span class="t">${esc(s)}</span><span class="p">${v.toFixed(1)}</span><div class="tr"><i style="width:${v/5*100}%"></i></div></div>`).join("")}</div>
   <div class="card"><h3>AI tools already used</h3><p class="sub">Share of people who have used each</p>${bars(tally(f.flatMap(x=>x.tools||[])),f.length,7)||"<p class='sub'>No tools reported yet.</p>"}</div>
  </div>`;
}

/* ---------- groups ---------- */
function groupsOf(ps){
  const m=new Map();ps.forEach(p=>{const k=p.level+"|"+p.dept;if(!m.has(k))m.set(k,[]);m.get(k).push(p)});
  const out=[],small={};
  for(const [k,arr] of m){const lv=k.split("|")[0];if(arr.length<MIN&&ps.length>=6)(small[lv]=small[lv]||[]).push(...arr);else out.push({level:lv,people:arr})}
  for(const lv in small){const ex=out.filter(g=>g.level===lv).sort((a,b)=>a.people.length-b.people.length)[0];if(ex&&small[lv].length<MIN)ex.people.push(...small[lv]);else out.push({level:lv,people:small[lv]})}
  out.sort((a,b)=>LEVELS.indexOf(a.level)-LEVELS.indexOf(b.level));
  out.forEach((g,i)=>{const ds=[...new Set(g.people.map(p=>p.dept))];g.name=`Group ${i+1}: ${ds.length===1?(DEPT[ds[0]]):"Mixed teams"}`;
    const c=new Map();g.people.forEach(p=>p.activities.forEach(a=>c.set(a.id,(c.get(a.id)||0)+1)));g.shared=[...c.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3)});
  return out;
}
function renderGroups(){
  const el=$("#v-groups");const ps=data().plans;
  const head=`<div class="top"><h1>Workshop groups</h1><p>For the hands-on lab, people at the same level from the same team work together. Find your code to see your group and the activities you'll run together.</p></div>`;
  if(!ps.length){el.innerHTML=head+`<div class="card empty"><h2>No plans yet</h2><p>Groups appear as plans are created.</p></div>`;return}
  el.innerHTML=head+`<div class="groups">${groupsOf(ps).map(g=>`<div class="grp"><div class="grp-h"><b>${esc(g.name)}</b><span class="pill ${g.level}">${g.level}s</span></div>
   <p class="lbl">${g.people.length} ${g.people.length===1?"person":"people"}</p><div class="codes">${g.people.map(p=>`<span>${esc(p.code)}</span>`).join("")}</div>
   <p class="lbl">Activities to run together</p><ol>${g.shared.map(([id,c])=>`<li>${esc((BYID[id]||{}).title||id)} <span style="color:var(--mute)">(${c})</span></li>`).join("")}</ol></div>`).join("")}</div>`;
}

/* ---------- library ---------- */
let libDept="All",libLevel="All";
function renderLibrary(){
  const el=$("#v-library");
  const list=LIB.filter(a=>(libDept==="All"||a.dept===libDept)&&(libLevel==="All"||a.levels.includes(libLevel)));
  const fb=(name,val,cur)=>`<button type="button" data-f="${name}" data-v="${val}" aria-pressed="${val===cur}">${val==="All"?"All":val==="CX"?"Customer Experience":val==="HR"?"Human Resources":val==="Allst"?"All staff":val}</button>`;
  el.innerHTML=`<div class="top"><h1>Activity library</h1><p>Every practice activity the AI can choose from. Each one uses fictional data and comes with a ready-made prompt and a quality check.</p></div>
  <div class="filters">${["All","HR","CX"].map(v=>fb("dept",v,libDept)).join("")}<span style="width:12px"></span>${["All",...LEVELS].map(v=>fb("level",v,libLevel)).join("")}</div>
  <div class="lib">${list.map(a=>`<details><summary>${esc(a.title)}<div class="tags"><span>${a.dept==="All"?"All staff":DEPT[a.dept]}</span>${a.levels.map(l=>`<span>${l}</span>`).join("")}<span>${a.minutes} min</span></div></summary>
   <p>${esc(a.scenario)}</p><div class="prompt">${esc(a.prompt)}</div><p style="font-size:14px"><b>What good looks like:</b> ${esc(a.check)}</p>${a.file?`<p class="meta">Practice file: <a href="${esc(a.file)}">${esc(a.file.replace("practice/",""))}</a></p>`:""}</details>`).join("")}</div>`;
  el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{if(b.dataset.f==="dept")libDept=b.dataset.v;else libLevel=b.dataset.v;renderLibrary()});
}

/* ---------- how it works ---------- */
function renderHow(){
  const steps=[["i-form","You answer","An anonymous form. No name, email or job title, just a code you make up.",""],["i-lock","Kept private","Answers go to a private spreadsheet that only the facilitator can open.",""],["i-clock","Checked automatically","A scheduled AI task looks for new responses throughout the day.",""],["i-spark","AI writes your plan","It reads your answers, picks and adapts three activities, and writes your capstone.","ai-step"],["i-shield","Privacy check","A separate check blocks anything that could identify you before it's published.",""],["i-globe","Published here","Only the de-identified plan appears on this site, under your code.",""]];
  $("#v-how").innerHTML=`<div class="top"><h1>How your plan was made</h1><p>This hub is itself an AI-integrated workflow, the same kind of thing you'll learn to build in the workshop. Nobody typed your plan by hand.</p></div>
  <div class="card"><h3>From form to plan, automatically</h3><p class="sub">Every step after you press Submit runs without anyone touching it</p>
   <div class="flow">${steps.map(([i,b,s,c],k)=>`<div class="fn ${c}"><div class="ic">${ico(i)}</div><b>${k+1}. ${b}</b><span>${s}</span></div>`).join("")}</div></div>
  <div class="grid g2" style="margin-top:18px">
   <div class="card"><h3>What the AI decides, and what rules decide</h3><p class="sub">So that everyone is treated fairly</p><ul>
    <li><b>Rules decide</b> your level (from your comfort ratings and the AI tools you've used) and your data-safety level (from the types of information you handle). The same answers always give the same result.</li>
    <li><b>AI decides</b> which three activities fit your work best, how to adapt them, and how to turn your goal into a capstone challenge.</li>
    <li><b>People decide</b> everything else. The activities are written and reviewed by the facilitator, and the AI can only choose from them.</li></ul></div>
   <div class="card"><h3>What is and isn't published</h3><p class="sub">This site is public, so it only shows de-identified information</p>
    <p class="lbl">Published</p><ul class="yes"><li>Your code, team, level and plan</li><li>Group totals, with groups under ${MIN} people hidden</li></ul>
    <p class="lbl">Never published</p><ul class="no"><li>Your written answers, in any form</li><li>Names, job titles, colleagues, the organisation, its systems or places</li><li>Specific numbers you mentioned</li></ul></div>
  </div>`;
}

function renderAll(){renderLive();renderPlan();renderInsights();renderGroups();renderLibrary()}
document.querySelectorAll("nav.nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav.nav button").forEach(x=>x.removeAttribute("aria-current"));b.setAttribute("aria-current","page");view=b.dataset.view;["plan","insights","groups","library","how"].forEach(v=>$("#v-"+v).classList.toggle("hidden",v!==view));window.scrollTo(0,0)});
$("#leaveSample").onclick=()=>{useSample=false;lastCode="";renderAll()};
renderHow();refresh(true);setInterval(()=>refresh(false),120000);
})();
</script>
